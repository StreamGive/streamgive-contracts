name: Bug report
description: Report a bug in one of the smart contracts, scripts, or docs
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! If you suspect a security vulnerability, **do not open a public issue** — please follow `SECURITY.md` and email `security@streamgive.io`.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which contract or part of the repository is affected?
      options:
        - donation-vault
        - ngo-registry
        - scripts / deployment
        - docs
        - CI / tooling
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can maintainers reproduce the issue? Include failing test cases or commands if available.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened, including error codes, panic messages, or command output?
      render: shell

  - type: input
    id: environment
    attributes:
      label: Commit / environment
      description: Git commit SHA, Rust toolchain version, and Soroban/Stellar CLI version (if applicable).
      placeholder: "e.g. main @ abc1234, rustc 1.x, stellar-cli x.y.z"
